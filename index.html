<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Action Medicine — Price Lookup</title>
<style>
  :root{
    --ink:#13343b;
    --ink-soft:#4a6770;
    --teal:#0e6e6e;
    --teal-deep:#0a4f52;
    --teal-tint:#e3f1ef;
    --paper:#f7faf9;
    --card:#ffffff;
    --line:#d8e6e3;
    --coral:#e2643f;
    --coral-soft:#fdeee8;
    --gold:#f2b441;
    --radius:18px;
    --shadow:0 2px 10px rgba(14,79,82,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Avenir Next","Segoe UI",Seravek,system-ui,-apple-system,sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
  }
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font:inherit}

  /* ---------- Header ---------- */
  header{
    background:linear-gradient(135deg,var(--teal-deep) 0%,var(--teal) 70%);
    color:#fff;
    padding:22px 20px 26px;
  }
  .head-inner{max-width:860px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .brand-logo{
    width:48px;height:48px;border-radius:50%;flex-shrink:0;
    box-shadow:0 2px 8px rgba(0,0,0,.22);
  }
  .gear-wrap{position:relative;margin-left:4px}
  .gear-btn{
    width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.14);
    display:flex;align-items:center;justify-content:center;color:#fff;position:relative;
  }
  .gear-btn:hover{background:rgba(255,255,255,.26)}
  .gear-btn.on{background:var(--gold);color:#4a3403}
  .gear-btn .dot{
    position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;
    background:var(--coral);border:2px solid var(--teal-deep);display:none;
  }
  body.dirty .gear-btn .dot{display:block}
  .menu{
    position:absolute;right:0;top:50px;background:#fff;color:var(--ink);
    border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.25);padding:8px;
    min-width:240px;display:none;z-index:60;
  }
  .menu.open{display:block}
  .menu button{
    display:flex;width:100%;align-items:center;gap:10px;padding:11px 12px;
    border-radius:9px;font-size:.92rem;font-weight:600;color:var(--ink-soft);text-align:left;
  }
  .menu button:hover{background:var(--teal-tint);color:var(--teal-deep)}
  .menu button.active{background:var(--teal);color:#fff}
  .menu button.menu-danger{color:var(--coral)}
  .menu button.menu-danger:hover{background:var(--coral-soft);color:var(--coral)}
  .menu hr{border:none;border-top:1px solid var(--line);margin:6px 4px}
  .menu .badge{
    margin-left:auto;background:var(--coral);color:#fff;font-size:.68rem;font-weight:700;
    padding:2px 8px;border-radius:999px;display:none;
  }
  body.dirty .menu .badge{display:inline-block}
  .brand h1{font-size:1.25rem;font-weight:600;letter-spacing:.01em;line-height:1.2}
  .brand .sub{font-size:.8rem;opacity:.75;font-weight:400}
  .updated-chip{
    margin-left:auto;background:var(--gold);color:#4a3403;font-weight:700;
    font-size:.84rem;padding:7px 14px;border-radius:999px;display:flex;align-items:center;gap:7px;
    box-shadow:0 2px 8px rgba(0,0,0,.18);white-space:nowrap;
  }
  body.dirty .updated-chip{background:var(--coral);color:#fff}
  .searchbar{position:relative}
  .searchbar svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);opacity:.55}
  #search{
    width:100%;padding:14px 44px 14px 48px;border:none;border-radius:14px;
    font-size:1.05rem;background:#fff;color:var(--ink);outline:none;
    box-shadow:0 3px 14px rgba(0,0,0,.18);
  }
  #search::placeholder{color:#8aa6a4}
  #clearSearch{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:32px;height:32px;border-radius:50%;color:#5c7d7b;display:none;
    align-items:center;justify-content:center;font-size:1.2rem;line-height:1;
  }
  #clearSearch:hover{background:#eef5f4}

  /* ---------- Layout ---------- */
  main{max-width:860px;margin:0 auto;padding:20px 16px 64px}
  .hidden{display:none !important}

  /* ---------- Notice box / settings ---------- */
  .notice{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px;
    font-size:.92rem;color:var(--ink-soft);line-height:1.5;
  }
  .notice .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .notice input{
    border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:.92rem;outline:none;
    flex:1;min-width:140px;
  }
  .notice input:focus{border-color:var(--teal)}
  .notice label{font-size:.78rem;font-weight:700;color:var(--ink-soft);display:block;margin:8px 0 3px}
  .notice .fine{font-size:.78rem;color:#8aa19e;margin-top:8px;line-height:1.45}

  /* ---------- Tiles ---------- */
  .tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:6px}
  .tile{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 16px;display:flex;align-items:center;gap:14px;text-align:left;
    box-shadow:var(--shadow);transition:transform .12s ease,box-shadow .12s ease;
    border-left:6px solid var(--tile-c,var(--teal));position:relative;
  }
  .tile:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(14,79,82,.14)}
  .tile:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
  .tile-icon{
    width:52px;height:52px;border-radius:14px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    background:var(--tile-bg,var(--teal-tint));color:var(--tile-c,var(--teal));
  }
  .tile-name{font-weight:600;font-size:1.02rem;line-height:1.25}
  .tile-count{font-size:.8rem;color:var(--ink-soft);margin-top:3px}
  .tile.add-cat{border:1.5px dashed var(--line);border-left:1.5px dashed var(--line);box-shadow:none;color:var(--ink-soft);display:none}
  body.editing .tile.add-cat{display:flex}
  .tile.add-cat:hover{border-color:var(--teal);color:var(--teal-deep)}
  .addcat-form{
    display:none;margin-top:14px;gap:8px;flex-wrap:wrap;background:var(--card);
    border:1.5px dashed var(--line);border-radius:14px;padding:13px;align-items:center;
  }
  .addcat-form.open{display:flex}
  .addcat-form input{
    flex:1;min-width:180px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:.95rem;outline:none;
  }
  .addcat-form input:focus{border-color:var(--teal)}

  /* ---------- Category & search views ---------- */
  .view-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .back-btn{
    display:flex;align-items:center;gap:6px;color:var(--teal-deep);font-weight:600;
    padding:8px 14px 8px 8px;border-radius:10px;
  }
  .back-btn:hover{background:var(--teal-tint)}
  .view-title{font-size:1.3rem;font-weight:700;flex:1;min-width:160px;display:flex;align-items:center;gap:10px}
  .cat-dot{width:14px;height:14px;border-radius:5px;flex-shrink:0}
  .item-list{display:flex;flex-direction:column;gap:10px}
  .item{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);
  }
  .item.flash{animation:flash 1.6s ease}
  @keyframes flash{0%,40%{background:#fff7df;border-color:var(--gold)}100%{background:var(--card)}}
  .item-main{flex:1;min-width:0}
  .item-name{font-weight:600;font-size:1.02rem}
  .item-note{font-size:.84rem;color:var(--ink-soft);margin-top:2px;line-height:1.35}
  .item-cat{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
  .price{
    font-weight:700;font-size:1.06rem;
    padding:6px 13px;border-radius:999px;white-space:nowrap;
  }
  .price.contact{background:var(--coral-soft) !important;color:var(--coral) !important;font-size:.88rem}
  .cat-note{
    background:#fff8ea;border:1px solid #f0dfb4;border-radius:12px;padding:11px 14px;
    font-size:.88rem;color:#6a5618;margin-bottom:14px;line-height:1.45;
  }
  .group-head{
    font-size:.95rem;font-weight:700;margin:18px 0 4px;display:flex;align-items:center;gap:8px;
  }
  .group-head:first-child{margin-top:0}
  .empty-msg{
    text-align:center;color:var(--ink-soft);padding:36px 16px;font-size:.95rem;line-height:1.5;
  }

  /* ---------- Edit mode ---------- */
  .item-actions{display:none;gap:6px}
  body.editing .item-actions{display:flex}
  .icon-btn{
    width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);border:1px solid var(--line);background:#fff;
  }
  .icon-btn:hover{background:var(--teal-tint);color:var(--teal-deep)}
  .icon-btn.danger:hover{background:var(--coral-soft);color:var(--coral)}
  .add-row,.danger-zone{display:none}
  body.editing .add-row{display:flex}
  body.editing .danger-zone{display:block}
  .add-row{
    margin-top:14px;gap:8px;flex-wrap:wrap;background:var(--card);
    border:1.5px dashed var(--line);border-radius:14px;padding:13px;
  }
  .add-row input{
    border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:.95rem;outline:none;background:#fff;
  }
  .add-row input:focus{border-color:var(--teal)}
  .in-name{flex:2;min-width:150px}
  .in-price{flex:1;min-width:90px;max-width:130px}
  .in-note{flex:2;min-width:150px}
  .btn{padding:10px 18px;border-radius:10px;font-weight:600;font-size:.92rem}
  .btn-primary{background:var(--teal);color:#fff}
  .btn-primary:hover{background:var(--teal-deep)}
  .btn-primary:disabled{opacity:.6;cursor:default}
  .btn-ghost{border:1px solid var(--line);background:#fff;color:var(--ink-soft)}
  .btn-danger{background:var(--coral);color:#fff}
  .danger-zone{margin-top:26px;text-align:center}
  .link-danger{color:var(--coral);font-size:.86rem;font-weight:600;text-decoration:underline}
  .confirm-inline{
    display:flex;gap:8px;justify-content:center;align-items:center;margin-top:10px;flex-wrap:wrap;
    font-size:.9rem;color:var(--ink-soft);
  }

  .item.editing-item{flex-wrap:wrap}
  .item.editing-item .edit-fields{display:flex;gap:8px;flex-wrap:wrap;flex:1 1 100%}
  .edit-fields input{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:.93rem;outline:none}
  .edit-fields input:focus{border-color:var(--teal)}

  @media (max-width:560px){
    .tile-grid{grid-template-columns:1fr 1fr;gap:10px}
    .tile{flex-direction:column;text-align:center;padding:16px 10px;gap:10px;border-left:1px solid var(--line);border-top:6px solid var(--tile-c,var(--teal))}
    .tile.add-cat{border:1.5px dashed var(--line)}
    .tile-name{font-size:.92rem}
    .price{font-size:.98rem;padding:5px 11px}
    .updated-chip{margin-left:auto;order:3;width:100%;justify-content:center}
    .gear-wrap{margin-left:auto}
  }
  @media (prefers-reduced-motion:reduce){
    .tile{transition:none}
    .item.flash{animation:none;background:#fff7df}
  }
</style>
</head>

function slugIn(name, list){

  let id = base, k = 2;

/* ================= CSV helpers ================= */
function csvField(v){
  v = String(v==null?"":v);
  return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
}
function buildCSV(){
  let rows = [["Category","Service","Price","Note"]];
  data.forEach(cat=>{
    if(cat.items.length===0) rows.push([cat.name,"","",""]);   // keep empty categories
    cat.items.forEach(it=>rows.push([cat.name,it.n,it.p,it.note||""]));
  });
  return rows.map(r=>r.map(csvField).join(",")).join("\r\n");
}
function parseCSV(text){
  const rows = []; let row = [], field = "", inQ = false;
  text = text.replace(/^\uFEFF/,"");
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(inQ){
      if(ch==='"'){
        if(text[i+1]==='"'){ field+='"'; i++; } else inQ=false;
      } else field+=ch;
    } else {
      if(ch==='"') inQ=true;
      else if(ch===','){ row.push(field); field=""; }
      else if(ch==='\n' || ch==='\r'){
        if(ch==='\r' && text[i+1]==='\n') i++;
        row.push(field); field="";
        if(row.some(f=>f.trim()!=="")) rows.push(row);
        row=[];
      }
      else field+=ch;
    }
  }
  row.push(field);
  if(row.some(f=>f.trim()!=="")) rows.push(row);
  return rows;
}

/* Build categories from CSV rows, keeping icon/color/note for known names */
function buildCats(rows){
  if(rows.length && /^category$/i.test((rows[0][0]||"").trim())) rows = rows.slice(1);
  const newCats = [], byName = {};
  let itemCount = 0, skipped = 0;
  rows.forEach(r=>{
    const catName = (r[0]||"").trim();
    const n = (r[1]||"").trim();
    const p = (r[2]||"").trim();
    const note = (r[3]||"").trim();
    if(!catName){ skipped++; return; }
    let cat = byName[catName.toLowerCase()];
    if(!cat){
      const existing = data.find(c=>c.name.toLowerCase()===catName.toLowerCase())
                    || DEFAULT_CATS.find(c=>c.name.toLowerCase()===catName.toLowerCase());
      cat = {
        id: existing ? existing.id : null,
        name: catName,
        icon: existing ? existing.icon : "generic",
        color: existing ? existing.color : null,
        note: existing ? existing.note : "",
        items: []
      };
      byName[catName.toLowerCase()] = cat;
      newCats.push(cat);
    }
    if(n && p){ cat.items.push(note?{n,p,note}:{n,p}); itemCount++; }
    else if(n || p){ skipped++; }
  });
  newCats.forEach(c=>{ if(!c.id) c.id = slugIn(c.name, newCats.filter(x=>x.id)); });
  const usedColors = newCats.map(c=>c.color).filter(Boolean);
  let pi = 0;
  newCats.forEach(c=>{
    if(!c.color){
      while(usedColors.includes(PALETTE[pi % PALETTE.length])) pi++;
      c.color = PALETTE[pi % PALETTE.length];
      usedColors.push(c.color); pi++;
    }
  });
  return {cats:newCats, itemCount, skipped};
}

/* ================= Remote prices (prices.csv on the website) ================= */
async function fetchRemote(){
  const res = await fetch(CSV_PATH + "?nocache=" + Date.now(), {cache:"no-store"});
  if(!res.ok) throw new Error("HTTP " + res.status);
  const text = await res.text();
  const built = buildCats(parseCSV(text));
  if(!built.cats.length) throw new Error("empty file");
  const lm = res.headers.get("last-modified");
  const date = lm ? new Date(lm).toISOString().slice(0,10) : store.updated;
  return {cats: built.cats, date};
}

async function loadRemote(force){
  try{
    const remote = await fetchRemote();
    if(force || !store.dirty){
      store.cats = remote.cats; data = store.cats;
      store.updated = remote.date; store.dirty = false;
      save(false);
      currentCat = null; renderTiles(); show(homeView); hideNotice();
    }else{
      notice(`This computer has <strong>unpublished price edits</strong>. They're only visible here until you publish them.
        <div class="row">
          <button class="btn btn-primary" id="nPub">Publish to website</button>
          <button class="btn btn-ghost" id="nDiscard">Discard my edits</button>
        </div>`);
      $("nPub").addEventListener("click", ()=>{ hideNotice(); publish(); });
      $("nDiscard").addEventListener("click", ()=>loadRemote(true));
    }
    return true;
  }catch(e){
    return false; // offline or opened as a local file — keep local/default data
  }
}

/* ================= Publishing (GitHub API) ================= */
function detectRepo(){
  try{
    const h = location.hostname;
    if(h.endsWith(".github.io")){
      const owner = h.split(".")[0];
      const segs = location.pathname.split("/").filter(p=>p && !p.includes("."));
      return {owner, repo: segs[0] || (owner + ".github.io")};
    }
  }catch(e){}
  return {owner:"", repo:""};
}
function getCfg(){
  try{
    const raw = localStorage.getItem(CFG_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {...detectRepo(), token:""};
}
function saveCfg(cfg){
  try{ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }catch(e){}
}

function openSetup(msg){

    ${msg?`<div style="color:var(--coral);margin-top:6px">${esc(msg)}</div>`:""}
    <label>GitHub username</label>

    <label>Repository name</label>
    <input id="cfgRepo" value="${esc(cfg.repo)}" placeholder="e.g. prices" autocomplete="off">
    <label>Access token</label>
    <input id="cfgToken" type="password" value="${esc(cfg.token)}" placeholder="github_pat_…" autocomplete="off">
    <div class="row">
      <button class="btn btn-primary" id="cfgSave">Save setup</button>
      <button class="btn btn-ghost" id="cfgCancel">Cancel</button>
    </div>
    <div class="fine">The token is saved only in this browser on this computer — it is never part of the website itself. Create one at github.com → Settings → Developer settings → Fine-grained tokens, with access to just this repository and "Contents: Read and write" permission. Anyone with this token can change the price list, so don't share it.</div>`);
  $("cfgSave").addEventListener("click", ()=>{
    const cfg2 = {
      owner: $("cfgOwner").value.trim(),
      repo: $("cfgRepo").value.trim(),
      token: $("cfgToken").value.trim()
    };
    saveCfg(cfg2); hideNotice();
    if(store.dirty) publish();
  });
  $("cfgCancel").addEventListener("click", hideNotice);
}

async function publish(){
  const cfg = getCfg();
  if(!cfg.owner || !cfg.repo || !cfg.token){
    openSetup("Fill these in first, then publishing will start automatically.");
    return;
  }
  closeMenu(); show(homeView);
  notice("Publishing…");
  const api = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${CSV_PATH}`;
  const headers = {
    "Authorization": "Bearer " + cfg.token,
    "Accept": "application/vnd.github+json"
  };
  try{
    // current file SHA (needed to update; absent if file doesn't exist yet)
    let sha = null;
    const getRes = await fetch(api, {headers});
    if(getRes.ok){ sha = (await getRes.json()).sha; }
    else if(getRes.status !== 404){ throw new Error(httpMsg(getRes.status)); }

    const csv = "\uFEFF" + buildCSV();
    const body = {
      message: "Update prices (" + new Date().toISOString().slice(0,10) + ")",
      content: btoa(unescape(encodeURIComponent(csv)))
    };
    if(sha) body.sha = sha;
    const putRes = await fetch(api, {method:"PUT", headers, body: JSON.stringify(body)});
    if(!putRes.ok) throw new Error(httpMsg(putRes.status));

    store.dirty = false;
    store.updated = new Date().toISOString().slice(0,10);
    save(false);
    notice(`✓ Published! The new prices will be live for everyone at the website link within about a minute.
      <div class="row"><button class="btn btn-ghost" id="nOk">OK</button></div>`);
    $("nOk").addEventListener("click", hideNotice);
  }catch(err){
    notice(`Couldn't publish: ${esc(err.message||"network error")}.
      <div class="row">
        <button class="btn btn-primary" id="nRetry">Try again</button>
        <button class="btn btn-ghost" id="nSetup">Check setup</button>
        <button class="btn btn-ghost" id="nClose">Close</button>
      </div>
      <div class="fine">Your edits are still saved on this computer — nothing is lost.</div>`);
    $("nRetry").addEventListener("click", publish);
    $("nSetup").addEventListener("click", ()=>openSetup());
    $("nClose").addEventListener("click", hideNotice);
  }
}
function httpMsg(s){
  if(s===401) return "the access token was rejected (expired or mistyped)";
  if(s===403) return "the token doesn't have permission for this repository";
  if(s===404) return "repository not found — check the username and repository name";
  return "GitHub returned an error (" + s + ")";
}

/* ================= Tiles ================= */
function renderTiles(){
  tileGrid.innerHTML = "";

  const total = data.reduce((s,c)=>s+c.items.length,0);
  const allTile = document.createElement("button");
  allTile.className = "tile";
  allTile.style.setProperty("--tile-c","#44606a");
  allTile.style.setProperty("--tile-bg","#e8eef0");
  allTile.innerHTML = `
    <div class="tile-icon">${ICONS.all}</div>
    <div>
      <div class="tile-name">All Prices</div>
      <div class="tile-count">${total} items in one list</div>
    </div>`;
  allTile.addEventListener("click", openAll);
  tileGrid.appendChild(allTile);

  data.forEach(cat=>{
    const c = catColor(cat);
    const b = document.createElement("button");
    b.className = "tile";
    b.style.setProperty("--tile-c", c);
    b.style.setProperty("--tile-bg", c + "18");
    b.innerHTML = `
      <div class="tile-icon">${ICONS[cat.icon]||ICONS.generic}</div>
      <div>
        <div class="tile-name">${esc(cat.name)}</div>
        <div class="tile-count">${cat.items.length ? cat.items.length+" items" : "Nothing here yet"}</div>
      </div>`;
    b.addEventListener("click", ()=>openCategory(cat.id));
    tileGrid.appendChild(b);
  });

  const addTile = document.createElement("button");
  addTile.className = "tile add-cat";
  addTile.innerHTML = `
    <div class="tile-icon" style="background:#f1f0ec;color:#7d7a6e">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </div>
    <div><div class="tile-name">Add category</div><div class="tile-count">Create a new section</div></div>`;
  addTile.addEventListener("click", ()=>{
    $("addCatForm").classList.add("open");
    $("newCatName").focus();
  });
  tileGrid.appendChild(addTile);
}

/* ---- Add category form ---- */
$("addCatBtn").addEventListener("click", addCategory);
$("newCatName").addEventListener("keydown", e=>{ if(e.key==="Enter") addCategory(); });
$("cancelCatBtn").addEventListener("click", ()=>{
  $("newCatName").value=""; $("addCatForm").classList.remove("open");
});
function addCategory(){
  const name = $("newCatName").value.trim();
  if(!name) return;
  const used = data.map(c=>c.color);
  const color = PALETTE.find(p=>!used.includes(p)) || PALETTE[data.length % PALETTE.length];
  data.push({ id:slugIn(name, data), name, icon:"generic", color, note:"", items:[] });
  $("newCatName").value=""; $("addCatForm").classList.remove("open");
  save(); renderTiles();
}

/* ================= Price pill ================= */
function priceHTML(p, color){
  const contact = /ask|contact|call|tbd/i.test(p);
  const c = color || "#0e6e6e";
  return `<div class="price${contact?" contact":""}" style="background:${c}15;color:${c}">${esc(p)}</div>`;
}

/* ================= Category view ================= */
function openCategory(id, flashName){
  currentCat = data.find(c=>c.id===id);
  if(!currentCat) return;
  editingIndex = -1;
  pendingFlash = flashName || null;
  const c = catColor(currentCat);
  $("catTitle").innerHTML = `<span class="cat-dot" style="background:${c}"></span>${esc(currentCat.name)}`;
  $("catNote").innerHTML = currentCat.note ? `<div class="cat-note">${esc(currentCat.note)}</div>` : "";
  renderCatItems();
  renderDangerZone();
  show(catView);
  window.scrollTo({top:0});
}

function renderCatItems(){
  catItems.innerHTML = "";
  const c = catColor(currentCat);
  if(currentCat.items.length===0 && editingIndex===-1){
    catItems.innerHTML = `<div class="empty-msg">No prices in this category yet.<br>Turn on <strong>Edit prices</strong> (gear menu, top right) to add them.</div>`;
  }
  currentCat.items.forEach((it,i)=>{
    const row = document.createElement("div");
    if(i===editingIndex){
      row.className = "item editing-item";
      row.innerHTML = `
        <div class="edit-fields">
          <input class="in-name" id="editName" value="${esc(it.n)}" placeholder="Service name">
          <input class="in-price" id="editPrice" value="${esc(it.p)}" placeholder="Price">
          <input class="in-note" id="editNote" value="${esc(it.note||"")}" placeholder="Note (optional)">
          <button class="btn btn-primary" id="saveEdit">Save</button>
          <button class="btn btn-ghost" id="cancelEdit">Cancel</button>
        </div>`;
      catItems.appendChild(row);
      row.querySelector("#saveEdit").addEventListener("click", ()=>{
        const n = row.querySelector("#editName").value.trim();
        const p = row.querySelector("#editPrice").value.trim();
        const note = row.querySelector("#editNote").value.trim();
        if(!n || !p) return;
        currentCat.items[i] = note ? {n,p,note} : {n,p};
        editingIndex = -1; save(); renderCatItems(); renderTiles();
      });
      row.querySelector("#cancelEdit").addEventListener("click", ()=>{ editingIndex=-1; renderCatItems(); });
      return;
    }
    row.className = "item";
    row.innerHTML = `
      <div class="item-main">
        <div class="item-name">${esc(it.n)}</div>
        ${it.note?`<div class="item-note">${esc(it.note)}</div>`:""}
      </div>
      ${priceHTML(it.p, c)}
      <div class="item-actions">
        <button class="icon-btn" title="Edit" aria-label="Edit ${esc(it.n)}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
        </button>
        <button class="icon-btn danger" title="Delete" aria-label="Delete ${esc(it.n)}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </button>
      </div>`;
    const [editB, delB] = row.querySelectorAll(".icon-btn");
    editB.addEventListener("click", ()=>{ editingIndex=i; renderCatItems(); });
    delB.addEventListener("click", ()=>{
      if(delB.dataset.armed){
        currentCat.items.splice(i,1); save(); renderCatItems(); renderTiles();
      }else{
        delB.dataset.armed = "1";
        delB.style.background = "var(--coral)"; delB.style.color = "#fff"; delB.style.borderColor = "var(--coral)";
        delB.title = "Tap again to confirm delete";
        setTimeout(()=>{ delete delB.dataset.armed; delB.removeAttribute("style"); delB.title="Delete"; }, 2500);
      }
    });
    if(pendingFlash && it.n===pendingFlash){
      row.classList.add("flash");
      setTimeout(()=>row.scrollIntoView({behavior:"smooth",block:"center"}),60);
      pendingFlash = null;
    }
    catItems.appendChild(row);
  });
}

function renderDangerZone(){
  const dz = $("dangerZone");
  dz.innerHTML = `
    <button class="link-danger" id="clearCat">Delete all prices in this category</button>
    &nbsp;·&nbsp;
    <button class="link-danger" id="deleteCat">Delete this whole category</button>
    <div class="confirm-inline hidden" id="dzConfirm"></div>`;
  const conf = ()=>$("dzConfirm");
  $("clearCat").addEventListener("click", ()=>{
    conf().classList.remove("hidden");
    conf().innerHTML = `Delete everything in “${esc(currentCat.name)}”? <button class="btn btn-danger" id="dzYes">Yes, delete all</button> <button class="btn btn-ghost" id="dzNo">Cancel</button>`;
    $("dzYes").addEventListener("click", ()=>{
      currentCat.items = []; save(); renderCatItems(); renderTiles(); conf().classList.add("hidden");
    });
    $("dzNo").addEventListener("click", ()=>conf().classList.add("hidden"));
  });
  $("deleteCat").addEventListener("click", ()=>{
    conf().classList.remove("hidden");
    conf().innerHTML = `Remove the “${esc(currentCat.name)}” category and its ${currentCat.items.length} item${currentCat.items.length===1?"":"s"}? <button class="btn btn-danger" id="dzYes2">Yes, remove it</button> <button class="btn btn-ghost" id="dzNo2">Cancel</button>`;
    $("dzYes2").addEventListener("click", ()=>{
      data.splice(data.indexOf(currentCat),1);
      currentCat = null; save(); renderTiles(); show(homeView);
    });
    $("dzNo2").addEventListener("click", ()=>conf().classList.add("hidden"));
  });
}

/* ================= Add item ================= */
$("addBtn").addEventListener("click", addItem);
["newName","newPrice","newNote"].forEach(id=>{
  $(id).addEventListener("keydown", e=>{ if(e.key==="Enter") addItem(); });
});
function addItem(){
  const n=$("newName").value.trim(), p=$("newPrice").value.trim(), note=$("newNote").value.trim();
  if(!n || !p){ return; }
  currentCat.items.push(note?{n,p,note}:{n,p});
  $("newName").value=""; $("newPrice").value=""; $("newNote").value="";
  save(); renderCatItems(); renderTiles(); $("newName").focus();
}

/* ================= All Prices view ================= */
function openAll(){
  currentCat = null;
  allItems.innerHTML = "";
  data.forEach(cat=>{
    if(!cat.items.length) return;
    const c = catColor(cat);
    const head = document.createElement("div");
    head.className = "group-head";
    head.innerHTML = `<span class="cat-dot" style="background:${c}"></span>${esc(cat.name)}`;
    allItems.appendChild(head);
    const list = document.createElement("div");
    list.className = "item-list";
    cat.items.forEach(it=>{
      const row = document.createElement("button");
      row.className = "item";
      row.style.textAlign = "left";
      row.title = "Open " + cat.name;
      row.innerHTML = `
        <div class="item-main">
          <div class="item-name">${esc(it.n)}</div>
          ${it.note?`<div class="item-note">${esc(it.note)}</div>`:""}
        </div>
        ${priceHTML(it.p, c)}`;
      row.addEventListener("click", ()=>openCategory(cat.id, it.n));
      list.appendChild(row);
    });
    allItems.appendChild(list);
  });
  if(!allItems.children.length){
    allItems.innerHTML = `<div class="empty-msg">No prices anywhere yet.</div>`;
  }
  show(allView);
  window.scrollTo({top:0});
}

/* ================= Search ================= */
function runSearch(q){
  const term = q.trim().toLowerCase();
  if(!term){ clearBtn.style.display="none"; show(currentCat?catView:homeView); if(!currentCat) renderTiles(); return; }
  clearBtn.style.display="flex";
  const results = [];
  data.forEach(cat=>{
    cat.items.forEach(it=>{
      const hay = (it.n+" "+(it.note||"")+" "+it.p+" "+cat.name).toLowerCase();
      if(hay.includes(term)) results.push({cat,it});
    });
  });
  $("searchTitle").textContent = results.length
    ? `${results.length} result${results.length===1?"":"s"} for “${q.trim()}”`
    : `No results for “${q.trim()}”`;
  searchItems.innerHTML = results.length ? "" :
    `<div class="empty-msg">Try a shorter word — for example “flu”, “titer”, or “member”.</div>`;
  results.forEach(r=>{
    const c = catColor(r.cat);
    const row = document.createElement("button");
    row.className = "item";
    row.style.textAlign = "left";
    row.innerHTML = `
      <div class="item-main">
        <div class="item-cat" style="color:${c}">${esc(r.cat.name)}</div>
        <div class="item-name">${esc(r.it.n)}</div>
        ${r.it.note?`<div class="item-note">${esc(r.it.note)}</div>`:""}
      </div>
      ${priceHTML(r.it.p, c)}`;
    row.addEventListener("click", ()=>{
      searchInput.value=""; clearBtn.style.display="none";
      openCategory(r.cat.id, r.it.n);
    });
    searchItems.appendChild(row);
  });
  show(searchView);
}
searchInput.addEventListener("input", e=>runSearch(e.target.value));
clearBtn.addEventListener("click", ()=>{ searchInput.value=""; runSearch(""); searchInput.focus(); });

/* ================= CSV export / import ================= */
$("exportBtn").addEventListener("click", ()=>{
  closeMenu();
  const csv = buildCSV();
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "action-medicine-prices-" + store.updated + ".csv";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
});

$("importBtn").addEventListener("click", ()=>{ closeMenu(); $("importFile").click(); });
$("importFile").addEventListener("change", e=>{
  const file = e.target.files[0];
  e.target.value = "";
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let built;
    try{ built = buildCats(parseCSV(String(reader.result))); }
    catch(err){ msgNotice("Couldn't read that file as CSV."); return; }
    if(!built.cats.length){ msgNotice("No usable rows found. Expected columns: Category, Service, Price, Note."); return; }
    show(homeView);
    notice(`Replace all current prices with <strong>${built.itemCount} items in ${built.cats.length} categories</strong> from “${esc(file.name)}”?${built.skipped?` (${built.skipped} incomplete row${built.skipped===1?"":"s"} will be skipped.)`:""} You'll still need to publish afterward to make it live for everyone.
      <div class="row">
        <button class="btn btn-primary" id="impYes">Yes, import</button>
        <button class="btn btn-ghost" id="impNo">Cancel</button>
      </div>`);
    $("impYes").addEventListener("click", ()=>{
      store.cats = built.cats; data = store.cats;
      currentCat = null; save(); renderTiles(); show(homeView); hideNotice();
    });
    $("impNo").addEventListener("click", hideNotice);
  };
  reader.readAsText(file);
});
function msgNotice(msg){
  show(homeView);
  notice(`${esc(msg)} <div class="row"><button class="btn btn-ghost" id="nOk2">OK</button></div>`);
  $("nOk2").addEventListener("click", hideNotice);
}

/* ================= Gear menu ================= */
const gearBtn = $("gearBtn"), gearMenu = $("gearMenu");
function closeMenu(){ gearMenu.classList.remove("open"); gearBtn.setAttribute("aria-expanded","false"); }
gearBtn.addEventListener("click", e=>{
  e.stopPropagation();
  const open = gearMenu.classList.toggle("open");
  gearBtn.setAttribute("aria-expanded", open);
});
document.addEventListener("click", e=>{
  if(gearMenu.classList.contains("open") && !gearMenu.contains(e.target) && e.target!==gearBtn) closeMenu();
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeMenu(); });

function setEditing(on){
  document.body.classList.toggle("editing", on);
  $("editToggle").classList.toggle("active", on);
  gearBtn.classList.toggle("on", on);
  $("editToggle").setAttribute("aria-pressed", on);
  $("editLabel").textContent = on ? "Done editing" : "Edit prices";
  if(!on){ $("addCatForm").classList.remove("open"); }
  if(currentCat) renderCatItems();
}

$("editToggle").addEventListener("click", ()=>{
  closeMenu();
  if(document.body.classList.contains("editing")){ setEditing(false); return; }
  // Ask for the staff password — purely to prevent accidental changes
  currentCat = null; editingIndex = -1; renderTiles(); show(homeView);
  notice(`<strong>Staff password</strong> — this just makes sure prices aren't changed by accident.
    <div class="row">
      <input id="pwIn" type="text" placeholder="Password" autocomplete="off" autocapitalize="none">
      <button class="btn btn-primary" id="pwGo">Unlock editing</button>
      <button class="btn btn-ghost" id="pwNo">Cancel</button>
    </div>
    <div class="fine">The password is <strong>action</strong>.</div>`);
  const tryPw = ()=>{
    if($("pwIn").value.trim().toLowerCase() === EDIT_PASSWORD){
      hideNotice(); setEditing(true);
    }else{
      $("pwIn").value = "";
      $("pwIn").placeholder = "Not quite — the password is action";
      $("pwIn").focus();
    }
  };
  $("pwGo").addEventListener("click", tryPw);
  $("pwIn").addEventListener("keydown", e=>{ if(e.key==="Enter") tryPw(); });
  $("pwNo").addEventListener("click", hideNotice);
  $("pwIn").focus();
});

$("publishBtn").addEventListener("click", publish);
$("setupBtn").addEventListener("click", ()=>openSetup());
$("reloadBtn").addEventListener("click", async ()=>{
  closeMenu(); show(homeView);
  if(store.dirty){
    notice(`Reloading from the website will <strong>discard the unpublished edits</strong> on this computer. Continue?
      <div class="row">
        <button class="btn btn-danger" id="rlYes">Yes, discard & reload</button>
        <button class="btn btn-ghost" id="rlNo">Cancel</button>
      </div>`);
    $("rlYes").addEventListener("click", async ()=>{
      hideNotice();
      const ok = await loadRemote(true);
      if(!ok) msgNotice("Couldn't reach the website — check the internet connection. Your local data is unchanged.");
    });
    $("rlNo").addEventListener("click", hideNotice);
  }else{
    const ok = await loadRemote(true);
    if(!ok) msgNotice("Couldn't reach the website — check the internet connection.");
  }
});

/* ================= Navigation ================= */
$("backBtn").addEventListener("click", ()=>{ currentCat=null; editingIndex=-1; renderTiles(); show(homeView); });
$("backBtnAll").addEventListener("click", ()=>{ renderTiles(); show(homeView); });

/* ================= Init ================= */
renderUpdated();
renderTiles();
loadRemote(false);
</script>
